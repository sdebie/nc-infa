# Quarkus Configuration
quarkus.application.name=nursery-infra
quarkus.application.version=1.0.0-SNAPSHOT

# Database Configuration
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/nursery_db?currentSchema=public
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres

# Flyway Configuration
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true

# JPA/Hibernate Configuration
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.dialect=org.hibernate.dialect.PostgreSQLDialect

# Metrics
quarkus.micrometer.enabled=true
quarkus.micrometer.registry-enabled-default=false
quarkus.micrometer.export.prometheus.enabled=true

# Logging
quarkus.log.level=INFO
quarkus.log.category."org.flyway".level=INFO
